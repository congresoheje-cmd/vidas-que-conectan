<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | Vidas que Conectan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f8f8;
      color: #24454b;
    }
    .hero {
      text-align: center;
      padding: 38px 20px;
      background: #dcefed;
    }
    .hero h1 { margin: 0 0 8px; font-size: 30px; }
    .hero p { margin: 0; color: #5c7277; }
    .container {
      width: min(1200px, calc(100% - 30px));
      margin: 30px auto;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }
    .login-card { max-width: 500px; margin: 30px auto; }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #c8d6d8;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #3d9d76;
      color: white;
    }
    button.secondary { background: #5c7277; }
    button:disabled { opacity: .65; cursor: not-allowed; }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }
    .toolbar input {
      flex: 1;
      min-width: 220px;
      margin: 0;
    }
    .stats {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e0e8e9;
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #e8eeee;
      text-align: left;
      font-size: 14px;
    }
    th { background: #eef6f5; }
    tr:last-child td { border-bottom: 0; }
    .message {
      display: none;
      padding: 14px;
      border-radius: 9px;
      margin-bottom: 16px;
    }
    .error { background: #fff0f1; color: #8a2630; }
    .success { background: #e9f7ef; color: #245b43; }
    .hidden { display: none !important; }
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .muted { color: #6b8389; font-size: 14px; }
    @media (max-width: 650px) {
      .card { padding: 20px; }
      .hero h1 { font-size: 25px; }
    }
  </style>
</head>
<body>

<header class="hero">
  <h1>Panel de administración</h1>
  <p>I Congreso Interdisciplinario “Vidas que Conectan”</p>
</header>

<main class="container">

  <section id="loginCard" class="card login-card">
    <h2>Acceso administrativo</h2>
    <p class="muted">Ingresa con la cuenta autorizada en Supabase.</p>

    <div id="loginError" class="message error"></div>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" id="loginButton">INGRESAR</button>
    </form>
  </section>

  <section id="adminPanel" class="hidden">

    <div class="card">
      <div class="topline">
        <div>
          <h2 style="margin:0 0 5px;">Inscripciones</h2>
          <div id="adminEmail" class="muted"></div>
        </div>
        <button type="button" class="secondary" id="logoutButton">CERRAR SESIÓN</button>
      </div>
    </div>

    <div class="card">
      <div id="panelMessage" class="message"></div>

      <div class="stats">
        Total de inscritos: <span id="totalCount">0</span>
      </div>

      <div class="toolbar">
        <input
          type="search"
          id="searchInput"
          placeholder="Buscar por nombre, cédula, correo, institución..."
        >
        <button type="button" id="refreshButton">ACTUALIZAR</button>
        <button type="button" id="csvButton">DESCARGAR CSV</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombres</th>
              <th>Cédula</th>
              <th>Correo</th>
              <th>Contacto</th>
              <th>Institución</th>
              <th>Título académico</th>
              <th>Servicio / área</th>
              <th>Acepta datos</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://dmgzqoycsfvhsvjsbnws.supabase.co";
  const SUPABASE_KEY = "sb_publishable_29FazKqvo2ouVcNDjbWvqw_iEfRcp4x";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginCard = document.getElementById("loginCard");
  const adminPanel = document.getElementById("adminPanel");
  const loginForm = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const loginError = document.getElementById("loginError");
  const logoutButton = document.getElementById("logoutButton");
  const refreshButton = document.getElementById("refreshButton");
  const csvButton = document.getElementById("csvButton");
  const searchInput = document.getElementById("searchInput");
  const tableBody = document.getElementById("tableBody");
  const totalCount = document.getElementById("totalCount");
  const adminEmail = document.getElementById("adminEmail");
  const panelMessage = document.getElementById("panelMessage");

  let inscripciones = [];

  function showMessage(element, text, type = "error") {
    element.textContent = text;
    element.className = "message " + type;
    element.style.display = "block";
  }

  function hideMessage(element) {
    element.style.display = "none";
  }

  async function comprobarSesion() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
      showMessage(loginError, error.message);
      return;
    }

    if (data.session) {
      await mostrarPanel(data.session);
    } else {
      mostrarLogin();
    }
  }

  function mostrarLogin() {
    loginCard.classList.remove("hidden");
    adminPanel.classList.add("hidden");
  }

  async function mostrarPanel(session) {
    loginCard.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    adminEmail.textContent = session.user.email || "";
    await cargarInscripciones();
  }

  loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    hideMessage(loginError);

    loginButton.disabled = true;
    loginButton.textContent = "INGRESANDO...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    loginButton.disabled = false;
    loginButton.textContent = "INGRESAR";

    if (error) {
      showMessage(loginError, "No se pudo iniciar sesión. Verifica el correo y la contraseña.");
      console.error("LOGIN:", error);
      return;
    }

    await mostrarPanel(data.session);
  });

  logoutButton.addEventListener("click", async function() {
    await supabaseClient.auth.signOut();
    inscripciones = [];
    tableBody.innerHTML = "";
    totalCount.textContent = "0";
    mostrarLogin();
  });

  async function cargarInscripciones() {
    hideMessage(panelMessage);
    refreshButton.disabled = true;
    refreshButton.textContent = "CARGANDO...";

    const { data, error } = await supabaseClient
      .from("inscripciones")
      .select("*")
      .order("id", { ascending: true });

    refreshButton.disabled = false;
    refreshButton.textContent = "ACTUALIZAR";

    if (error) {
      console.error("INSCRIPCIONES:", error);
      showMessage(
        panelMessage,
        "No se pudieron cargar las inscripciones. Verifica que tu usuario esté agregado en la tabla admins."
      );
      return;
    }

    inscripciones = data || [];
    renderizarTabla();
  }

  function renderizarTabla() {
    const termino = searchInput.value.trim().toLowerCase();

    const filtradas = inscripciones.filter(row => {
      if (!termino) return true;

      return [
        row.id,
        row.nombres,
        row.cedula,
        row.correo,
        row.contacto,
        row.institucion,
        row.titulo_academico,
        row.servicio
      ].some(value =>
        String(value ?? "").toLowerCase().includes(termino)
      );
    });

    totalCount.textContent = inscripciones.length;
    tableBody.innerHTML = "";

    if (filtradas.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 9;
      td.textContent = "No hay resultados.";
      tr.appendChild(td);
      tableBody.appendChild(tr);
      return;
    }

    filtradas.forEach(row => {
      const tr = document.createElement("tr");

      [
        row.id,
        row.nombres,
        row.cedula,
        row.correo,
        row.contacto,
        row.institucion,
        row.titulo_academico,
        row.servicio,
        row.acepta_datos ? "Sí" : "No"
      ].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value ?? "";
        tr.appendChild(td);
      });

      tableBody.appendChild(tr);
    });
  }

  searchInput.addEventListener("input", renderizarTabla);
  refreshButton.addEventListener("click", cargarInscripciones);

  csvButton.addEventListener("click", function() {
    if (!inscripciones.length) {
      showMessage(panelMessage, "No hay inscripciones para descargar.");
      return;
    }

    const headers = [
      "ID",
      "Nombres",
      "Cedula",
      "Correo",
      "Contacto",
      "Institucion",
      "Titulo academico",
      "Servicio",
      "Acepta datos"
    ];

    const rows = inscripciones.map(row => [
      row.id,
      row.nombres,
      row.cedula,
      row.correo,
      row.contacto,
      row.institucion,
      row.titulo_academico,
      row.servicio,
      row.acepta_datos ? "Sí" : "No"
    ]);

    const csv = [headers, ...rows]
      .map(row =>
        row.map(value =>
          '"' + String(value ?? "").replace(/"/g, '""') + '"'
        ).join(",")
      )
      .join("\r\n");

    const blob = new Blob(["\uFEFF" + csv], {
      type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "inscripciones_vidas_que_conectan.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session) {
      mostrarPanel(session);
    } else {
      mostrarLogin();
    }
  });

  comprobarSesion();
</script>

</body>
</html>
